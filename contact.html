<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thaghrah | Contact</title>
    <meta name="description" content="Contact the Thaghrah team for collaboration, demo requests, and project inquiries." />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./js/app.js"></script>
  </head>
  <body data-page="contact">
    <div id="site-nav"></div>
    <header class="hero">
      <div class="container hero-content">
        <p class="eyebrow">Contact</p>
        <h2>Let’s Connect</h2>
        <p class="hero-subtitle">Reach out for collaboration, demo requests, and project discussions.</p>
      </div>
    </header>
    <main>
      <section class="container section">
        <h3 class="section-heading">Contact Form</h3>
        <form class="contact-form glass">
          <label>
            Full Name
            <input type="text" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>
          <label>
            Subject
            <input type="text" placeholder="How can we help?" />
          </label>
          <label>
            Message
            <textarea rows="5" placeholder="Write your message..."></textarea>
          </label>
          <button class="btn primary" type="button">Send Message</button>
        </form>
      </section>

      <section class="container section">
        <h3 class="section-heading">Collaboration</h3>
        <div class="info-grid">
          <article class="info-card"><h4>Email</h4><p><a href="mailto:info@thaghrah.com">info@thaghrah.com</a></p></article>
          <article class="info-card"><h4>GitHub</h4><p><a href="#">Project Repository</a></p></article>
          <article class="info-card"><h4>LinkedIn</h4><p><a href="https://www.linkedin.com/in/noorabumjaid" target="_blank" rel="noopener noreferrer">Noora Abdulrahman Bumjaid</a></p></article>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <button id="scrollTopBtn" class="scroll-top" type="button" aria-label="Scroll to top">↑</button>
  </body>
</html>
